<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Telegram Mini App: нужен для облачного сохранения (вне Telegram ничего не делает) -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <title>Драка на (грибной) поляне</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Golos+Text:wght@400;500;600;700&family=Caveat:wght@700&display=swap">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-compost" viewBox="0 0 32 32">
      <path d="M4 25c0-6 5-9 12-9s12 3 12 9c0 2-2 3-4 3H8c-2 0-4-1-4-3z" fill="#6b4426" stroke="#3e2512" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M9 17c-1-5 2-9 7-10-1 5-3 8-7 10z" fill="#e0a03a" stroke="#3e2512" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M17 16c1-5 5-7 9-6-2 4-5 6-9 6z" fill="#c0662f" stroke="#3e2512" stroke-width="2.2" stroke-linejoin="round"/>
      <circle cx="12" cy="23" r="1.4" fill="#3e2512"/><circle cx="20" cy="22" r="1.4" fill="#3e2512"/>
    </symbol>
    <symbol id="i-spore" viewBox="0 0 32 32">
      <circle cx="11" cy="18" r="6.5" fill="#f3ead6" stroke="#3e2512" stroke-width="2.4"/>
      <circle cx="21" cy="12" r="5.5" fill="#fff8ec" stroke="#3e2512" stroke-width="2.4"/>
      <circle cx="21" cy="23" r="4.2" fill="#e8d9b8" stroke="#3e2512" stroke-width="2.4"/>
      <circle cx="9.5" cy="16.5" r="1.4" fill="#c8b48e"/><circle cx="20" cy="10.5" r="1.3" fill="#c8b48e"/>
    </symbol>
    <symbol id="i-star" viewBox="0 0 32 32">
      <path d="M16 3.5l3.6 7.6 8.2 1.1-6 5.7 1.5 8.2L16 22.2l-7.3 3.9 1.5-8.2-6-5.7 8.2-1.1z" fill="#ffd45c" stroke="#3e2512" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M12 12.5l2.4-.4" stroke="#fff6cf" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-clock" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="11" fill="#fff8ec" stroke="#3e2512" stroke-width="2.6"/>
      <path d="M16 10v6l4 3" fill="none" stroke="#3e2512" stroke-width="2.6" stroke-linecap="round"/>
    </symbol>
    <symbol id="t-farm" viewBox="0 0 32 32">
      <path d="M5 25h22" stroke="#3e2512" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M16 25V13" stroke="#3e2512" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M16 16c-1-5-5-7-9-6 1 4 4 6 9 6z" fill="#7cc05a" stroke="#3e2512" stroke-width="2.3" stroke-linejoin="round"/>
      <path d="M16 13c1-5 5-8 10-7-1 5-5 7-10 7z" fill="#98d46f" stroke="#3e2512" stroke-width="2.3" stroke-linejoin="round"/>
    </symbol>
    <symbol id="t-squad" viewBox="0 0 32 32">
      <path d="M12 17h8v7a3 3 0 0 1-3 3h-2a3 3 0 0 1-3-3z" fill="#f7f0e3" stroke="#3e2512" stroke-width="2.4"/>
      <path d="M4 17c0-7 5-12 12-12s12 5 12 12z" fill="#d2392a" stroke="#3e2512" stroke-width="2.4" stroke-linejoin="round"/>
      <circle cx="11" cy="11" r="2" fill="#fff8ec"/><circle cx="19" cy="9" r="2.4" fill="#fff8ec"/><circle cx="23" cy="14" r="1.6" fill="#fff8ec"/>
    </symbol>
    <symbol id="t-forest" viewBox="0 0 32 32">
      <path d="M16 3l-7 9h4l-6 8h18l-6-8h4z" fill="#4f8a3c" stroke="#3e2512" stroke-width="2.3" stroke-linejoin="round"/>
      <path d="M16 20v8" stroke="#3e2512" stroke-width="3" stroke-linecap="round"/>
      <path d="M13 10l3-3" stroke="#98d46f" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="t-shop" viewBox="0 0 32 32">
      <path d="M6 11h20l-1.6 14a3 3 0 0 1-3 2.6H10.6a3 3 0 0 1-3-2.6z" fill="#e0b04a" stroke="#3e2512" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M11 13V9a5 5 0 0 1 10 0v4" fill="none" stroke="#3e2512" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M12 18h8" stroke="#fff4c8" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-heart" viewBox="0 0 32 32">
      <path d="M16 27S4 19.5 4 11.5A6 6 0 0 1 16 9a6 6 0 0 1 12 2.5C28 19.5 16 27 16 27z" fill="#f0644c" stroke="#3e2512" stroke-width="2.6" stroke-linejoin="round"/>
      <path d="M9 11.5a3 3 0 0 1 3-3" stroke="#ffb3a0" stroke-width="2" stroke-linecap="round" fill="none"/>
    </symbol>
    <symbol id="i-sword" viewBox="0 0 32 32">
      <path d="M24 4h4v4L15 21l-4-4z" fill="#d6dde3" stroke="#3e2512" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M8 16l8 8M10 22l-5 5" stroke="#3e2512" stroke-width="3" stroke-linecap="round"/>
      <path d="M9 17l6 6" stroke="#e0b04a" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>
    <symbol id="g-earth" viewBox="0 0 32 32">
      <path d="M16 2.5 26.5 11 16 29.5 5.5 11z" fill="#e8a33c" stroke="#3e2512" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M16 2.5 11 11 16 29.5 5.5 11z" fill="#ffe1a0"/>
      <path d="M16 2.5 21 11 16 29.5 26.5 11z" fill="#a8601a" opacity=".45"/>
      <path d="M5.5 11h21" stroke="#3e2512" stroke-width="1.4" opacity=".55"/>
      <path d="M16 2.5 26.5 11 16 29.5 5.5 11z" fill="none" stroke="#3e2512" stroke-width="2.4" stroke-linejoin="round"/>
    </symbol>
    <symbol id="g-poison" viewBox="0 0 32 32">
      <path d="M16 2.5 26.5 11 16 29.5 5.5 11z" fill="#a765d8" stroke="#3e2512" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M16 2.5 11 11 16 29.5 5.5 11z" fill="#e6ccff"/>
      <path d="M16 2.5 21 11 16 29.5 26.5 11z" fill="#5e2e8c" opacity=".45"/>
      <path d="M5.5 11h21" stroke="#3e2512" stroke-width="1.4" opacity=".55"/>
      <path d="M16 2.5 26.5 11 16 29.5 5.5 11z" fill="none" stroke="#3e2512" stroke-width="2.4" stroke-linejoin="round"/>
    </symbol>
    <symbol id="g-wood" viewBox="0 0 32 32">
      <path d="M16 2.5 26.5 11 16 29.5 5.5 11z" fill="#3fbf78" stroke="#3e2512" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M16 2.5 11 11 16 29.5 5.5 11z" fill="#c4f5d4"/>
      <path d="M16 2.5 21 11 16 29.5 26.5 11z" fill="#1a7444" opacity=".45"/>
      <path d="M5.5 11h21" stroke="#3e2512" stroke-width="1.4" opacity=".55"/>
      <path d="M16 2.5 26.5 11 16 29.5 5.5 11z" fill="none" stroke="#3e2512" stroke-width="2.4" stroke-linejoin="round"/>
    </symbol>
    <symbol id="g-any" viewBox="0 0 32 32">
      <path d="M16 2.5 26.5 11 16 29.5 5.5 11z" fill="#e8f2f0" stroke="#3e2512" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M16 2.5 11 11 16 29.5 5.5 11z" fill="#ffffff"/>
      <path d="M11 11 16 2.5 21 11z" fill="#ffd45c" opacity=".7"/><path d="M5.5 11 11 11 16 29.5z" fill="#c98cff" opacity=".6"/><path d="M21 11 26.5 11 16 29.5z" fill="#6fe09a" opacity=".6"/>
      <path d="M16 2.5 26.5 11 16 29.5 5.5 11z" fill="none" stroke="#3e2512" stroke-width="2.4" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-gear" viewBox="0 0 32 32">
      <path d="M13.6 3.5h4.8l.8 3.6 2.4 1 3.1-2 3.4 3.4-2 3.1 1 2.4 3.6.8v4.8l-3.6.8-1 2.4 2 3.1-3.4 3.4-3.1-2-2.4 1-.8 3.6h-4.8l-.8-3.6-2.4-1-3.1 2-3.4-3.4 2-3.1-1-2.4-3.6-.8v-4.8l3.6-.8 1-2.4-2-3.1 3.4-3.4 3.1 2 2.4-1z" fill="#d6dde3" stroke="#3e2512" stroke-width="2.2" stroke-linejoin="round"/>
      <circle cx="16" cy="16" r="4.6" fill="#fff4dc" stroke="#3e2512" stroke-width="2.2"/>
    </symbol>
  </defs>
</svg>

<main class="page">

  <div class="frame" id="frame" data-screen="title">
    <div id="game"></div>
    <div class="loading" id="loading">Растим поляну…</div>

    <div class="hud">
      <div class="lvl" id="lvl-ring" style="--xp: 62"><span class="lvl-num" id="lvl">3</span></div>
      <div class="res crys" id="r-crystals" title="Кристаллы: янтарь, аметист, изумруд">
        <svg><use href="#g-earth"/></svg><span id="c-earth">4</span>
        <svg><use href="#g-poison"/></svg><span id="c-poison">2</span>
        <svg><use href="#g-wood"/></svg><span id="c-wood">3</span>
      </div>
      <div class="res" id="r-spores" title="Споры"><svg><use href="#i-spore"/></svg><span>6</span></div>
      <div class="res" id="r-stars" title="Звёзды (демо)"><svg><use href="#i-star"/></svg><span>25</span></div>
      <button class="gear" type="button" data-open-settings aria-label="Настройки"><svg aria-hidden="true"><use href="#i-gear"/></svg></button>
    </div>

    <nav class="nav" aria-label="Разделы игры">
      <button class="tab" type="button" aria-current="page" data-tab="Ферма" data-screen="farm"><span class="tab-ic"><svg><use href="#t-farm"/></svg></span><span class="tab-name">Ферма</span></button>
      <button class="tab" type="button" data-tab="Отряд" data-screen="squad"><span class="tab-ic"><svg><use href="#t-squad"/></svg></span><span class="tab-name">Отряд</span><span class="badge" id="squad" hidden>0</span></button>
      <button class="tab" type="button" data-tab="Лес" data-screen="forest"><span class="tab-ic"><svg><use href="#t-forest"/></svg></span><span class="tab-name">Лес</span></button>
      <button class="tab" type="button" data-tab="Лавка" data-screen="shop"><span class="tab-ic"><svg><use href="#t-shop"/></svg></span><span class="tab-name">Лавка</span></button>
    </nav>

    <section class="scr-squad" id="scr-squad" aria-label="Отряд" hidden></section>
    <div class="forest-ui" id="forest-ui" hidden>
      <div class="forest-title" id="forest-title"></div>
      <p class="forest-hint">Нажмите на светящийся круг, чтобы начать бой</p>
    </div>
    <div id="battle-ui" hidden>
      <div class="bt-top"><span class="bt-title" id="bt-title"></span><span class="bt-right"><button class="gear" type="button" data-open-settings aria-label="Настройки"><svg aria-hidden="true"><use href="#i-gear"/></svg></button><button class="bt-flee" id="bt-flee" type="button">Сбежать</button></span></div>
      <div class="bt-panel" id="battle-panel">
        <img id="bp-pt" alt="" hidden>
        <div class="bp-txt"><b id="bp-name"></b><span id="bp-hint"></span></div>
        <div class="bp-btns"><button class="pill" id="bp-auto" type="button" aria-pressed="false">Авто</button><button class="pill" id="bp-speed" type="button" aria-pressed="false">×2</button></div>
      </div>
    </div>
    <button class="fps" id="fps" type="button" title="Нажмите, чтобы включить или выключить ограничение 60 кадров">
      <span class="fps-row"><b class="good">--</b>FPS<span id="fps-ms"></span></span>
      <span class="fps-hz" id="fps-hz">измеряю экран…</span>
    </button>
    <div class="title" id="title">
      <h1 class="logo" aria-label="Драка на грибной поляне">
        <span class="logo-big">Драка</span>
        <span class="logo-small">на<span class="insert" aria-hidden="true"><b>(грибной)</b><i>‸</i></span>поляне</span>
      </h1>
      <div class="title-bottom">
        <div class="load" id="load">
          <div class="load-bar"><i id="load-fill"></i></div>
          <span class="load-text" id="load-text">Рисуем грибы…</span>
        </div>
        <button class="play" id="btn-play" type="button" hidden>Играть</button>
        <button class="title-link" type="button" data-open-settings>Настройки</button>
      </div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="sheet" id="sheet" hidden></div>
  </div>
</main>

<script type="module" src="src/main.js"></script>
<script>
  // Модули не загружаются из файла (file://): подсказываем, как запустить игру
  if (location.protocol === 'file:') {
    var box = document.getElementById('loading');
    box.innerHTML = '<div class="file-hint"><b>Так игра не запустится</b>' +
      '<span>Браузер не загружает модули из файла. Откройте собранную версию или запустите сервер разработки.</span>' +
      '<a href="dist/index.html">Открыть dist/index.html</a>' +
      '<code>node tools/serve.mjs</code></div>';
  }
</script>
</body>
</html>
